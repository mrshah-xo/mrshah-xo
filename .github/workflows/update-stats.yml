name: Update README stats

on:
  schedule:
    # Runs once a day at 03:17 UTC. Cron minute/hour picked off-the-hour
    # on purpose - avoids the "everyone's job fires at :00" GitHub Actions
    # scheduling pileup.
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        # persist-credentials defaults to true, so the later `git push`
        # authenticates with the ambient GITHUB_TOKEN. Pushes made with
        # that token don't re-trigger workflows, so this can't loop.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate stats
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          # Username and all card content come from config/profile.env -
          # nothing to fill in here.
        run: python generate_stats.py

      - name: Commit updated SVGs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git diff --staged --quiet || git commit -m "chore: refresh GitHub stats [skip ci]"
          git push
